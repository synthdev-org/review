# SonarCloud configuration. The organization and project key must match the
# project that you import in SonarCloud. The scan runs in .github/workflows/ci.yml.
sonar.organization=synthdev-org
sonar.projectKey=synthdev-org_review
sonar.projectName=review

# Folders named testing hold test doubles that the Dockerfile removes from the production image.
sonar.exclusions=**/testing/**,**/node_modules/**,**/dist/**,**/__pycache__/**,**/testdata/**,**/.venv/**,uv.lock,**/package-lock.json
# Why autoconfig is off: with it on, SonarCloud reads pytest's `testpaths` from
# pyproject.toml and sets sonar.tests to every package listed there. Tests sit
# beside the code in these packages, so all production modules became TEST files
# (diagnosed from the scanner's verbose "auto-detected tests" and "indexed as
# test" log lines). Production code is MAIN. Test files are picked by name below.
sonar.scanner.autoconfig.enabled=false
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/conftest.py,tests/**,**/*.test.tsx,**/*.test.ts,**/test-render.sh
# Keep tests and test tooling out of coverage. Test doubles sit in folders named testing.
# The Dockerfile removes them from the production image. Database migrations and the Admin UI have their own tests.
sonar.coverage.exclusions=**/test_*.py,**/conftest.py,tests/**,**/*.test.tsx,**/*.test.ts,**/migrations/**,apps/admin_api/frontend/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
