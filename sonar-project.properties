# SonarCloud configuration. The organization and project key must match the
# project that you import in SonarCloud. The scan runs in .github/workflows/ci.yml.
sonar.organization=synthdev-org
sonar.projectKey=synthdev-org_review
sonar.projectName=review

sonar.sources=.
sonar.tests=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/testdata/**,**/.venv/**,uv.lock,**/package-lock.json
# Tests live next to the code they test, so list them by name pattern.
sonar.test.inclusions=**/test_*.py,**/conftest.py,tests/**,**/*.test.tsx,**/*.test.ts
sonar.coverage.exclusions=**/test_*.py,**/conftest.py,tests/**,**/*.test.tsx,**/*.test.ts,**/migrations/**,apps/admin_api/frontend/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
