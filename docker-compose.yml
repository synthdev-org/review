# docker-compose.yml — local dev / CI E2E stack, per the plan's Phase 5
# ("Docker Compose stack") section. Wires Phases 1-4 together into the
# roadmap's Phase 0 exit criteria: "a Webhook API + Worker + Postgres that
# boots cleanly with no review capability yet." See
# docs/reference/c4-architecture.md's Level 3 diagram for the shape this
# mirrors, and ADR-0001 for why Compose locally / Helm (Phase 6) in
# production, over the same container images.
#
# Config: every environment variable referenced below is documented with a
# placeholder value in .env.example, per the C4 doc's "Compose reads local
# config from a plain .env file" note. Copy it to `.env` (gitignored — see
# .gitignore) and fill in real values before running `docker compose up`.
#
# Boot ordering / health, per the plan's Phase 5 requirement that `docker
# compose up` genuinely blocks until the stack is actually ready, not just
# "containers started":
#   1. `postgres` must report healthy (`pg_isready`) before anything else
#      starts.
#   2. `migrate` then runs `alembic upgrade head` followed by Phase 2's
#      pgvector-presence check (adapter/storage/startup_check_cli.py) and
#      exits. A failure in either step exits this service non-zero with the
#      error visible in `docker compose logs migrate` — Compose refuses to
#      start `webhook_api`/`worker` at all when a `depends_on:
#      condition: service_completed_successfully` dependency fails, so a
#      migration failure surfaces as a loud, immediate `docker compose up`
#      error, never a silent hang or a partially-booted stack.
#   3. `webhook_api` and `worker` both wait on `migrate` succeeding, then
#      start. `webhook_api`'s own healthcheck polls `/healthz`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review}
      POSTGRES_DB: ${POSTGRES_DB:-review}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review} -d ${POSTGRES_DB:-review}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # No named volume, on purpose: per the plan's Phase 5 "Observability &
    # rollback" section, this dev stack keeps no persistent volume by
    # default, so `docker compose down` + `up` is a genuine "start clean"
    # rather than a partial rollback that needs a bespoke procedure.

  migrate:
    build:
      context: .
      target: runtime
    image: review-app:compose-local
    environment:
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
    # `alembic upgrade head` (Phase 2's baseline migration, which also runs
    # `CREATE EXTENSION IF NOT EXISTS vector`) followed by the standalone
    # pgvector-presence check CLI (adapter/storage/startup_check_cli.py).
    # Either step failing exits this container non-zero with the error on
    # stdout/stderr, visible via `docker compose logs migrate`.
    command: ["sh", "-c", "alembic upgrade head && python -m adapter.storage.startup_check_cli"]
    depends_on:
      postgres:
        condition: service_healthy

  webhook_api:
    build:
      context: .
      target: runtime
    image: review-app:compose-local
    ports:
      - "${WEBHOOK_API_PORT:-8000}:8000"
    environment:
      REVIEW_WEBHOOK_API_ENVIRONMENT: ${REVIEW_WEBHOOK_API_ENVIRONMENT:-development}
      REVIEW_WEBHOOK_API_LOG_LEVEL: ${REVIEW_WEBHOOK_API_LOG_LEVEL:-INFO}
      # Required, no default (Phase 1) — installation/org/repo resolution
      # and delivery-idempotency (tenancy/resolution.py) cannot function
      # without a database. Same variable name migrate's block already
      # injects (adapter/storage/migrations/env.py reads it directly).
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
      # Required, no default — the webhook receiver's HMAC trust boundary
      # (docs/plans's Security review) cannot function without one.
      REVIEW_WEBHOOK_API_GITHUB_WEBHOOK_SECRET: >-
        ${REVIEW_WEBHOOK_API_GITHUB_WEBHOOK_SECRET:?set REVIEW_WEBHOOK_API_GITHUB_WEBHOOK_SECRET in .env, see .env.example}
      REVIEW_WEBHOOK_API_WEBHOOK_MAX_BODY_BYTES: ${REVIEW_WEBHOOK_API_WEBHOOK_MAX_BODY_BYTES:-1000000}
      REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_MAX_REQUESTS: >-
        ${REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_MAX_REQUESTS:-30}
      REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS: >-
        ${REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Disabled (0) by default, per the plan's Phase 1 pre-activation-gate
      # policy — see .env.example's own comment on this variable.
      REVIEW_WEBHOOK_API_REVIEW_ENQUEUE_RATE_LIMIT_PER_MINUTE: >-
        ${REVIEW_WEBHOOK_API_REVIEW_ENQUEUE_RATE_LIMIT_PER_MINUTE:-0}
      # Indexing kill switch (indexing delivery plan's Phase 1, Assumption
      # 11) — defaults to `false` so this stack ships inert (no `INDEX`
      # job ever enqueued) until an operator makes the affirmative choice
      # to set it `true`. Phase 7 wires the Worker's own INDEX-job
      # handling, so this is the first phase where enabling it does
      # anything.
      REVIEW_WEBHOOK_API_INDEXING_ENABLED: ${REVIEW_WEBHOOK_API_INDEXING_ENABLED:-false}
      REVIEW_WEBHOOK_API_INDEX_ENQUEUE_RATE_LIMIT_PER_MINUTE: >-
        ${REVIEW_WEBHOOK_API_INDEX_ENQUEUE_RATE_LIMIT_PER_MINUTE:-5}
      # SETUP_MODE off by default, per the plan's Security review
      # ("Manifest-flow gating") — only enable for the duration of a
      # one-time GitHub App creation flow.
      REVIEW_WEBHOOK_API_SETUP_MODE: ${REVIEW_WEBHOOK_API_SETUP_MODE:-false}
      REVIEW_WEBHOOK_API_SETUP_STATE_SECRET: ${REVIEW_WEBHOOK_API_SETUP_STATE_SECRET:-}
      REVIEW_WEBHOOK_API_SETUP_STATE_TTL_SECONDS: >-
        ${REVIEW_WEBHOOK_API_SETUP_STATE_TTL_SECONDS:-600}
      REVIEW_WEBHOOK_API_GITHUB_API_BASE_URL: >-
        ${REVIEW_WEBHOOK_API_GITHUB_API_BASE_URL:-https://api.github.com}
      REVIEW_WEBHOOK_API_GITHUB_API_TIMEOUT_SECONDS: >-
        ${REVIEW_WEBHOOK_API_GITHUB_API_TIMEOUT_SECONDS:-10}
      # Required, no default (docs/plans/plan-deliver-memory.md's Phase 4,
      # Unit D, US-M3) — a `pull_request closed` event's reaction fetch
      # runs synchronously in this route, before the handler returns, so
      # this entrypoint needs its own installation-token exchange
      # capability. Same App identity as REVIEW_WORKER_GITHUB_APP_* below —
      # without these, webhook_api fails to boot; see .env.example.
      REVIEW_WEBHOOK_API_GITHUB_APP_ID: >-
        ${REVIEW_WEBHOOK_API_GITHUB_APP_ID:?set REVIEW_WEBHOOK_API_GITHUB_APP_ID in .env, see .env.example}
      REVIEW_WEBHOOK_API_GITHUB_APP_PRIVATE_KEY: >-
        ${REVIEW_WEBHOOK_API_GITHUB_APP_PRIVATE_KEY:?set REVIEW_WEBHOOK_API_GITHUB_APP_PRIVATE_KEY in .env, see .env.example}
      REVIEW_WEBHOOK_API_GITHUB_RETRY_MAX_ATTEMPTS: >-
        ${REVIEW_WEBHOOK_API_GITHUB_RETRY_MAX_ATTEMPTS:-3}
      REVIEW_WEBHOOK_API_MEMORY_REACTION_POLL_MAX_COMMENTS_PER_POLL: >-
        ${REVIEW_WEBHOOK_API_MEMORY_REACTION_POLL_MAX_COMMENTS_PER_POLL:-50}
      # Required, no default (docs/plans/plan-deliver-memory.md's Phase 5,
      # Unit E, Assumption 7) — the admin API registers unconditionally
      # and enforces auth per-request via this key (US-M10); without it,
      # webhook_api fails to boot. See .env.example.
      REVIEW_WEBHOOK_API_ADMIN_API_KEY: >-
        ${REVIEW_WEBHOOK_API_ADMIN_API_KEY:?set REVIEW_WEBHOOK_API_ADMIN_API_KEY in .env, see .env.example}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl in the runtime image (Dockerfile, Phase 1) — the app's own
      # venv `python` (already on PATH) is always available, so this needs
      # no extra image dependency.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: .
      target: runtime
    image: review-app:compose-local
    command: ["python", "-m", "apps.worker.main"]
    environment:
      REVIEW_WORKER_ENVIRONMENT: ${REVIEW_WORKER_ENVIRONMENT:-development}
      REVIEW_WORKER_LOG_LEVEL: ${REVIEW_WORKER_LOG_LEVEL:-INFO}
      # Required, no default (Phase 3) — the claim/dispatch loop below
      # (apps/worker/dispatch.py) cannot claim or mark jobs without a
      # database. Same variable name migrate's/webhook_api's blocks already
      # inject.
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
      # LM Studio's OpenAI-compatible endpoint on the Docker host, per the
      # plan's Phase 5 instruction and the C4 doc's Level 3 diagram.
      REVIEW_WORKER_LLM_ENDPOINT: >-
        ${REVIEW_WORKER_LLM_ENDPOINT:-http://host.docker.internal:1234/v1}
      REVIEW_WORKER_LLM_API_KEY: ${REVIEW_WORKER_LLM_API_KEY:-not-needed}
      REVIEW_WORKER_LLM_MODEL: ${REVIEW_WORKER_LLM_MODEL:-local-model}
      REVIEW_WORKER_LLM_TIMEOUT_SECONDS: ${REVIEW_WORKER_LLM_TIMEOUT_SECONDS:-30}
      REVIEW_WORKER_POLL_INTERVAL_SECONDS: ${REVIEW_WORKER_POLL_INTERVAL_SECONDS:-2}
      REVIEW_WORKER_STUCK_JOB_WARNING_THRESHOLD_SECONDS: >-
        ${REVIEW_WORKER_STUCK_JOB_WARNING_THRESHOLD_SECONDS:-600}
      # Required, no default (Phase 4) — adapter/github/auth.py's JWT
      # signing (the GitHub App server-to-server auth flow) cannot function
      # without the App's own identity/private key. Without these, the
      # Worker crash-loops under `restart: unless-stopped` above — see
      # docs/reference/operations.md's dedicated entry for this case.
      REVIEW_WORKER_GITHUB_APP_ID: >-
        ${REVIEW_WORKER_GITHUB_APP_ID:?set REVIEW_WORKER_GITHUB_APP_ID in .env, see .env.example}
      REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY: >-
        ${REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY:?set REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY in .env, see .env.example}
      REVIEW_WORKER_GITHUB_API_BASE_URL: ${REVIEW_WORKER_GITHUB_API_BASE_URL:-https://api.github.com}
      REVIEW_WORKER_GITHUB_API_TIMEOUT_SECONDS: ${REVIEW_WORKER_GITHUB_API_TIMEOUT_SECONDS:-10}
      REVIEW_WORKER_GITHUB_RETRY_MAX_ATTEMPTS: ${REVIEW_WORKER_GITHUB_RETRY_MAX_ATTEMPTS:-3}
    # `host.docker.internal` is provided for free on Docker Desktop, but
    # plain Docker Engine on Linux needs this mapping to resolve it — this
    # is what actually makes the C4 doc's "worker calls LM Studio on the
    # Docker host" arrangement work on a Linux dev machine or a Linux CI
    # runner, not just macOS/Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Resource limits (Phase 5) — closes the gap between this pipeline's
    # per-step timeout (Phase 2) and actual container enforcement: a
    # pathological diff or a misbehaving analyzer subprocess (Gitleaks,
    # Semgrep) is bounded by both, not the timeout alone. Concrete starting
    # figures sized to run Gitleaks/Semgrep plus the Worker process
    # comfortably on a typical single-node Compose deployment (including
    # both analyzer sub-steps each materializing their own copy of the same
    # pre-filtered diff concurrently — see review/static_analysis.py's own
    # docstring), tunable per-deployment, not a value the platform
    # hardcodes.
    mem_limit: 2g
    cpus: "2"
    # No compose-level healthcheck: the Worker has no HTTP surface to probe
    # (apps/worker/dispatch.py's claim/dispatch loop, Phase 3, has no HTTP
    # surface either) — real liveness probing (a heartbeat file or a
    # minimal local health endpoint) is Phase 8 (production hardening)
    # scope, not built here. `main()`'s own startup checks (LLM
    # reachability, step configuration) are the fail-fast signal instead:
    # a genuine misconfiguration still exits non-zero at startup, logged
    # clearly, before this service ever reaches its dispatch loop. Once
    # past startup, `main()` runs the dispatch loop forever (Phase 3) — a
    # clean, intentional non-return, not a crash — so `restart:
    # unless-stopped` (not Compose's `"no"` default, unlike Phase 0/1/2's
    # "no dispatch loop wired yet" state that this replaces) keeps the
    # container up across the process's own long lifetime. A genuine
    # startup-check failure now restart-loops indefinitely rather than
    # exiting once — see docs/reference/operations.md's first entry for the
    # operator-facing diagnosis this trade-off requires — and
    # tests/e2e/test_compose_stack.py asserts the container stays
    # `running` (not `exited`) and never restarts during its observation
    # window, not the old "exits 0 once" claim.
    restart: unless-stopped
