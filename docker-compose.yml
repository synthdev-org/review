# docker-compose.yml — local dev / CI E2E stack, per the plan's Phase 5
# ("Docker Compose stack") section. Wires Phases 1-4 together into the
# roadmap's Phase 0 exit criteria: "a Webhook API + Worker + Postgres that
# boots cleanly with no review capability yet." See
# docs/reference/c4-architecture.md's Level 3 diagram for the shape this
# mirrors, and ADR-0001 for why Compose locally / Helm (Phase 6) in
# production, over the same container images.
#
# Config: every environment variable referenced below is documented with a
# placeholder value in .env.example, per the C4 doc's "Compose reads local
# config from a plain .env file" note. Copy it to `.env` (gitignored — see
# .gitignore) and fill in real values before running `docker compose up`.
#
# Boot ordering / health, per the plan's Phase 5 requirement that `docker
# compose up` genuinely blocks until the stack is actually ready, not just
# "containers started":
#   1. `postgres` must report healthy (`pg_isready`) before anything else
#      starts.
#   2. `migrate` then runs `alembic upgrade head` followed by Phase 2's
#      pgvector-presence check (adapter/storage/startup_check_cli.py) and
#      exits. A failure in either step exits this service non-zero with the
#      error visible in `docker compose logs migrate` — Compose refuses to
#      start `webhook_api`/`worker` at all when a `depends_on:
#      condition: service_completed_successfully` dependency fails, so a
#      migration failure surfaces as a loud, immediate `docker compose up`
#      error, never a silent hang or a partially-booted stack.
#   3. `webhook_api` and `worker` both wait on `migrate` succeeding, then
#      start. `webhook_api`'s own healthcheck polls `/healthz`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review}
      POSTGRES_DB: ${POSTGRES_DB:-review}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-review} -d ${POSTGRES_DB:-review}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    # No named volume, on purpose: per the plan's Phase 5 "Observability &
    # rollback" section, this dev stack keeps no persistent volume by
    # default, so `docker compose down` + `up` is a genuine "start clean"
    # rather than a partial rollback that needs a bespoke procedure.

  migrate:
    build:
      context: .
      target: runtime
    image: review-app:compose-local
    environment:
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
    # `alembic upgrade head` (Phase 2's baseline migration, which also runs
    # `CREATE EXTENSION IF NOT EXISTS vector`) followed by the standalone
    # pgvector-presence check CLI (adapter/storage/startup_check_cli.py).
    # Either step failing exits this container non-zero with the error on
    # stdout/stderr, visible via `docker compose logs migrate`.
    command: ["sh", "-c", "alembic upgrade head && python -m adapter.storage.startup_check_cli"]
    depends_on:
      postgres:
        condition: service_healthy

  webhook_api:
    build:
      context: .
      target: runtime
    image: review-app:compose-local
    ports:
      - "${WEBHOOK_API_PORT:-8000}:8000"
    environment:
      REVIEW_WEBHOOK_API_ENVIRONMENT: ${REVIEW_WEBHOOK_API_ENVIRONMENT:-development}
      REVIEW_WEBHOOK_API_LOG_LEVEL: ${REVIEW_WEBHOOK_API_LOG_LEVEL:-INFO}
      # Required, no default (Phase 1) — installation/org/repo resolution
      # and delivery-idempotency (tenancy/resolution.py) cannot function
      # without a database. Same variable name migrate's block already
      # injects (adapter/storage/migrations/env.py reads it directly).
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
      # Required, no default — the webhook receiver's HMAC trust boundary
      # (docs/plans's Security review) cannot function without one.
      REVIEW_WEBHOOK_API_GITHUB_WEBHOOK_SECRET: >-
        ${REVIEW_WEBHOOK_API_GITHUB_WEBHOOK_SECRET:?set REVIEW_WEBHOOK_API_GITHUB_WEBHOOK_SECRET in .env, see .env.example}
      REVIEW_WEBHOOK_API_WEBHOOK_MAX_BODY_BYTES: ${REVIEW_WEBHOOK_API_WEBHOOK_MAX_BODY_BYTES:-1000000}
      REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_MAX_REQUESTS: >-
        ${REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_MAX_REQUESTS:-30}
      REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS: >-
        ${REVIEW_WEBHOOK_API_WEBHOOK_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Disabled (0) by default, per the plan's Phase 1 pre-activation-gate
      # policy — see .env.example's own comment on this variable.
      REVIEW_WEBHOOK_API_REVIEW_ENQUEUE_RATE_LIMIT_PER_MINUTE: >-
        ${REVIEW_WEBHOOK_API_REVIEW_ENQUEUE_RATE_LIMIT_PER_MINUTE:-0}
      # Indexing kill switch (indexing delivery plan's Phase 1, Assumption
      # 11) — defaults to `false` so this stack ships inert (no `INDEX`
      # job ever enqueued) until an operator makes the affirmative choice
      # to set it `true`. Phase 7 wires the Worker's own INDEX-job
      # handling, so this is the first phase where enabling it does
      # anything.
      REVIEW_WEBHOOK_API_INDEXING_ENABLED: ${REVIEW_WEBHOOK_API_INDEXING_ENABLED:-false}
      REVIEW_WEBHOOK_API_INDEX_ENQUEUE_RATE_LIMIT_PER_MINUTE: >-
        ${REVIEW_WEBHOOK_API_INDEX_ENQUEUE_RATE_LIMIT_PER_MINUTE:-5}
      # SETUP_MODE off by default, per the plan's Security review
      # ("Manifest-flow gating") — only enable for the duration of a
      # one-time GitHub App creation flow.
      REVIEW_WEBHOOK_API_SETUP_MODE: ${REVIEW_WEBHOOK_API_SETUP_MODE:-false}
      REVIEW_WEBHOOK_API_SETUP_STATE_SECRET: ${REVIEW_WEBHOOK_API_SETUP_STATE_SECRET:-}
      REVIEW_WEBHOOK_API_SETUP_STATE_TTL_SECONDS: >-
        ${REVIEW_WEBHOOK_API_SETUP_STATE_TTL_SECONDS:-600}
      REVIEW_WEBHOOK_API_GITHUB_API_BASE_URL: >-
        ${REVIEW_WEBHOOK_API_GITHUB_API_BASE_URL:-https://api.github.com}
      REVIEW_WEBHOOK_API_GITHUB_API_TIMEOUT_SECONDS: >-
        ${REVIEW_WEBHOOK_API_GITHUB_API_TIMEOUT_SECONDS:-10}
      # docs/specs/spec-observability.md's Unit F: bare pass-through, not
      # `${OTEL_EXPORTER_OTLP_ENDPOINT:-}` — a `:-` default would inject an
      # *empty string* into this container's env even when unset on the
      # host/.env, which is not the same as the variable being absent
      # (WebhookAPISettings.otel_exporter_otlp_endpoint would then be `""`,
      # not `None`, breaking US10's no-op-by-default contract). The bare
      # `KEY:` form below instead passes the host/.env value through
      # verbatim when set, and leaves the variable genuinely unset in the
      # container otherwise — verified against this exact Compose version's
      # actual runtime behavior, not just its `config` rendering. Set
      # `OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317` in `.env`
      # (see .env.example) only when opting into `--profile observability`.
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
      # Required, no default (docs/plans/plan-deliver-memory.md's Phase 4,
      # Unit D, US-M3) — a `pull_request closed` event's reaction fetch
      # runs synchronously in this route, before the handler returns, so
      # this entrypoint needs its own installation-token exchange
      # capability. Same App identity as REVIEW_WORKER_GITHUB_APP_* below —
      # without these, webhook_api fails to boot; see .env.example.
      REVIEW_WEBHOOK_API_GITHUB_APP_ID: >-
        ${REVIEW_WEBHOOK_API_GITHUB_APP_ID:?set REVIEW_WEBHOOK_API_GITHUB_APP_ID in .env, see .env.example}
      REVIEW_WEBHOOK_API_GITHUB_APP_PRIVATE_KEY: >-
        ${REVIEW_WEBHOOK_API_GITHUB_APP_PRIVATE_KEY:?set REVIEW_WEBHOOK_API_GITHUB_APP_PRIVATE_KEY in .env, see .env.example}
      REVIEW_WEBHOOK_API_GITHUB_RETRY_MAX_ATTEMPTS: >-
        ${REVIEW_WEBHOOK_API_GITHUB_RETRY_MAX_ATTEMPTS:-3}
      REVIEW_WEBHOOK_API_MEMORY_REACTION_POLL_MAX_COMMENTS_PER_POLL: >-
        ${REVIEW_WEBHOOK_API_MEMORY_REACTION_POLL_MAX_COMMENTS_PER_POLL:-50}
    # docs/plans/plan-deliver-memory.md's Phase 3/4 (Unit C/D) gave this
    # service its own outbound GitHub calls (the synchronous `pull_request
    # closed` reaction poll, Unit D's second branch) — it needs the same
    # `host.docker.internal` mapping the `worker` service below already
    # carries, for the identical reason (see that service's own comment):
    # plain Docker Engine on Linux doesn't resolve this hostname for free.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No curl in the runtime image (Dockerfile, Phase 1) — the app's own
      # venv `python` (already on PATH) is always available, so this needs
      # no extra image dependency.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  admin_api:
    build:
      context: .
      target: runtime
    image: review-app:compose-local
    command: ["uvicorn", "apps.admin_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${ADMIN_API_PORT:-8001}:8001"
    environment:
      REVIEW_ADMIN_API_ENVIRONMENT: ${REVIEW_ADMIN_API_ENVIRONMENT:-development}
      REVIEW_ADMIN_API_LOG_LEVEL: ${REVIEW_ADMIN_API_LOG_LEVEL:-INFO}
      # Required, no default (Phase 1) — same shared database every other
      # entrypoint uses. Same variable name migrate's/webhook_api's/worker's
      # blocks already inject.
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
      REVIEW_ADMIN_API_SESSION_COOKIE_SECURE: >-
        ${REVIEW_ADMIN_API_SESSION_COOKIE_SECURE:-false}
      REVIEW_ADMIN_API_SESSION_IDLE_TIMEOUT_MINUTES: >-
        ${REVIEW_ADMIN_API_SESSION_IDLE_TIMEOUT_MINUTES:-30}
      # Required, no default (Assumption 11) — the bootstrap routine
      # (apps/admin_api/bootstrap.py) cannot create the first admin user
      # without them; every environment, including post-bootstrap restarts,
      # keeps these set (the routine is a no-op past the first run).
      REVIEW_ADMIN_API_ADMIN_BOOTSTRAP_USERNAME: >-
        ${REVIEW_ADMIN_API_ADMIN_BOOTSTRAP_USERNAME:?set REVIEW_ADMIN_API_ADMIN_BOOTSTRAP_USERNAME in .env, see .env.example}
      REVIEW_ADMIN_API_ADMIN_BOOTSTRAP_PASSWORD: >-
        ${REVIEW_ADMIN_API_ADMIN_BOOTSTRAP_PASSWORD:?set REVIEW_ADMIN_API_ADMIN_BOOTSTRAP_PASSWORD in .env, see .env.example}
      REVIEW_ADMIN_API_LOGIN_RATE_LIMIT_ATTEMPTS: >-
        ${REVIEW_ADMIN_API_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      REVIEW_ADMIN_API_LOGIN_RATE_LIMIT_WINDOW_MINUTES: >-
        ${REVIEW_ADMIN_API_LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      REVIEW_ADMIN_API_MIN_PASSWORD_LENGTH: ${REVIEW_ADMIN_API_MIN_PASSWORD_LENGTH:-12}
      # Required, no default (Assumption 13) — signs the session-bound CSRF
      # HMAC cookie; without it, admin_api fails to boot. See .env.example.
      REVIEW_ADMIN_API_ADMIN_CSRF_SECRET: >-
        ${REVIEW_ADMIN_API_ADMIN_CSRF_SECRET:?set REVIEW_ADMIN_API_ADMIN_CSRF_SECRET in .env, see .env.example}
      # docs/plans/plan-deliver-admin-gui.md's Phase 3 (Unit D) — the
      # Memory admin API's approve route moved here from apps/webhook_api
      # along with its own LocalONNXEmbeddingClient wiring. Same
      # Dockerfile-baked default every other entrypoint's own copy of this
      # setting uses.
      REVIEW_ADMIN_API_EMBEDDING_MODEL_PATH: >-
        ${REVIEW_ADMIN_API_EMBEDDING_MODEL_PATH:-/app/models/all-MiniLM-L6-v2}
      # docs/plans/plan-deliver-admin-gui.md's Phase 5 (Unit F) — model
      # routing's static-default tier. Same literal default as
      # REVIEW_WORKER_LLM_MODEL below; keep both in sync.
      REVIEW_ADMIN_API_LLM_MODEL: ${REVIEW_ADMIN_API_LLM_MODEL:-local-model}
      # docs/plans/plan-deliver-admin-gui.md's Phase 6 (Unit G) — the
      # admin-stats dashboard's Prometheus-reading adapter. Defaults to the
      # `prometheus` service below, which only actually starts under the
      # `observability` profile (see that block's own header comment); the
      # dashboard endpoint degrades to a clean 5xx (never a hang) if it's
      # not running, per that phase's own Observability & rollback section.
      REVIEW_ADMIN_API_PROMETHEUS_BASE_URL: >-
        ${REVIEW_ADMIN_API_PROMETHEUS_BASE_URL:-http://prometheus:9090}
      # Product knowledge (plan-deliver-product-knowledge.md Phase 6) — the
      # same credential map as the worker's; empty/unset means none. See
      # .env.example for the shape and the kill switch.
      REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_CREDENTIALS: ${REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_CREDENTIALS:-}
      REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_ENABLED: ${REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_ENABLED:-true}
      REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_CALL_TIMEOUT_SECONDS: >-
        ${REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_CALL_TIMEOUT_SECONDS:-5}
      REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_ALLOW_PRIVATE_NETWORKS: >-
        ${REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_ALLOW_PRIVATE_NETWORKS:-true}
      REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_ENDPOINT_ALLOWLIST: >-
        ${REVIEW_ADMIN_API_PRODUCT_KNOWLEDGE_ENDPOINT_ALLOWLIST:-}
      # See webhook_api's own identical entry above for why this is a bare
      # pass-through (`KEY:`, no `:-` default) rather than
      # `${OTEL_EXPORTER_OTLP_ENDPOINT:-}`.
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Same no-curl-in-the-runtime-image reasoning as webhook_api's own
      # healthcheck above.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8001/healthz', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    # The worker-only image target: `runtime` plus the interpreters the
    # static-analysis engines need (Node + ESLint, PHP + PHPStan, Go + golangci-lint; plan-phase-9
    # Decisions 1, 2, 4). The other services stay on `runtime` and gain none.
    build:
      context: .
      target: worker-runtime
    image: review-worker:compose-local
    command: ["python", "-m", "apps.worker.main"]
    environment:
      REVIEW_WORKER_ENVIRONMENT: ${REVIEW_WORKER_ENVIRONMENT:-development}
      REVIEW_WORKER_LOG_LEVEL: ${REVIEW_WORKER_LOG_LEVEL:-INFO}
      # Required, no default (Phase 3) — the claim/dispatch loop below
      # (apps/worker/dispatch.py) cannot claim or mark jobs without a
      # database. Same variable name migrate's/webhook_api's blocks already
      # inject.
      REVIEW_DATABASE_URL: >-
        ${REVIEW_DATABASE_URL:-postgresql+asyncpg://review:review@postgres:5432/review}
      # LM Studio's OpenAI-compatible endpoint on the Docker host, per the
      # plan's Phase 5 instruction and the C4 doc's Level 3 diagram.
      REVIEW_WORKER_LLM_ENDPOINT: >-
        ${REVIEW_WORKER_LLM_ENDPOINT:-http://host.docker.internal:1234/v1}
      REVIEW_WORKER_LLM_API_KEY: ${REVIEW_WORKER_LLM_API_KEY:-not-needed}
      REVIEW_WORKER_LLM_MODEL: ${REVIEW_WORKER_LLM_MODEL:-local-model}
      REVIEW_WORKER_LLM_TIMEOUT_SECONDS: ${REVIEW_WORKER_LLM_TIMEOUT_SECONDS:-30}
      REVIEW_WORKER_POLL_INTERVAL_SECONDS: ${REVIEW_WORKER_POLL_INTERVAL_SECONDS:-2}
      REVIEW_WORKER_STUCK_JOB_WARNING_THRESHOLD_SECONDS: >-
        ${REVIEW_WORKER_STUCK_JOB_WARNING_THRESHOLD_SECONDS:-600}
      # Required, no default (Phase 4) — adapter/github/auth.py's JWT
      # signing (the GitHub App server-to-server auth flow) cannot function
      # without the App's own identity/private key. Without these, the
      # Worker crash-loops under `restart: unless-stopped` above — see
      # docs/reference/operations.md's dedicated entry for this case.
      REVIEW_WORKER_GITHUB_APP_ID: >-
        ${REVIEW_WORKER_GITHUB_APP_ID:?set REVIEW_WORKER_GITHUB_APP_ID in .env, see .env.example}
      REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY: >-
        ${REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY:?set REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY in .env, see .env.example}
      REVIEW_WORKER_GITHUB_API_BASE_URL: ${REVIEW_WORKER_GITHUB_API_BASE_URL:-https://api.github.com}
      REVIEW_WORKER_GITHUB_API_TIMEOUT_SECONDS: ${REVIEW_WORKER_GITHUB_API_TIMEOUT_SECONDS:-10}
      REVIEW_WORKER_STATIC_ANALYSIS_MAX_CONCURRENT_ANALYZERS: ${REVIEW_WORKER_STATIC_ANALYSIS_MAX_CONCURRENT_ANALYZERS:-3}
      # Ruff static-analysis engine (docs/plans/plan-phase-9.md Phase 3). Set the
      # flag false for a quiet rollout; a blank timeout inherits the analyzer default.
      REVIEW_WORKER_STATIC_ANALYSIS_RUFF_ENABLED: ${REVIEW_WORKER_STATIC_ANALYSIS_RUFF_ENABLED:-true}
      REVIEW_WORKER_STATIC_ANALYSIS_RUFF_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_STATIC_ANALYSIS_RUFF_TIMEOUT_SECONDS:-}
      # ESLint (plan-phase-9 Phase 4), same semantics as Ruff above.
      REVIEW_WORKER_STATIC_ANALYSIS_ESLINT_ENABLED: ${REVIEW_WORKER_STATIC_ANALYSIS_ESLINT_ENABLED:-true}
      REVIEW_WORKER_STATIC_ANALYSIS_ESLINT_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_STATIC_ANALYSIS_ESLINT_TIMEOUT_SECONDS:-}
      # Trivy config scanning (plan-phase-9 Phase 6), same semantics as Ruff above.
      REVIEW_WORKER_STATIC_ANALYSIS_TRIVY_ENABLED: ${REVIEW_WORKER_STATIC_ANALYSIS_TRIVY_ENABLED:-true}
      REVIEW_WORKER_STATIC_ANALYSIS_TRIVY_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_STATIC_ANALYSIS_TRIVY_TIMEOUT_SECONDS:-}
      # PHPStan (plan-phase-9 Phase 7), same semantics as Ruff above.
      REVIEW_WORKER_STATIC_ANALYSIS_PHPSTAN_ENABLED: ${REVIEW_WORKER_STATIC_ANALYSIS_PHPSTAN_ENABLED:-true}
      REVIEW_WORKER_STATIC_ANALYSIS_PHPSTAN_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_STATIC_ANALYSIS_PHPSTAN_TIMEOUT_SECONDS:-}
      # golangci-lint (plan-phase-9 Phase 5), same semantics as Ruff above.
      REVIEW_WORKER_STATIC_ANALYSIS_GOLANGCI_LINT_ENABLED: ${REVIEW_WORKER_STATIC_ANALYSIS_GOLANGCI_LINT_ENABLED:-true}
      REVIEW_WORKER_STATIC_ANALYSIS_GOLANGCI_LINT_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_STATIC_ANALYSIS_GOLANGCI_LINT_TIMEOUT_SECONDS:-}
      REVIEW_WORKER_GITHUB_RETRY_MAX_ATTEMPTS: ${REVIEW_WORKER_GITHUB_RETRY_MAX_ATTEMPTS:-3}
      REVIEW_WORKER_CLONE_DETECTION_ENABLED: ${REVIEW_WORKER_CLONE_DETECTION_ENABLED:-true}
      REVIEW_WORKER_CLONE_DETECTION_STEP_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_CLONE_DETECTION_STEP_TIMEOUT_SECONDS:-30}
      REVIEW_WORKER_CLONE_DETECTION_MIN_TOKENS: ${REVIEW_WORKER_CLONE_DETECTION_MIN_TOKENS:-100}
      REVIEW_WORKER_CLONE_DETECTION_MIN_LINES: ${REVIEW_WORKER_CLONE_DETECTION_MIN_LINES:-10}
      REVIEW_WORKER_CLONE_DETECTION_MAX_FINDINGS: ${REVIEW_WORKER_CLONE_DETECTION_MAX_FINDINGS:-5}
      # Product knowledge (plan-deliver-product-knowledge.md Phase 6) —
      # optional external provider; empty/unset credentials means none. See
      # .env.example for the shape, the kill switch and the egress policy.
      REVIEW_WORKER_PRODUCT_KNOWLEDGE_CREDENTIALS: ${REVIEW_WORKER_PRODUCT_KNOWLEDGE_CREDENTIALS:-}
      REVIEW_WORKER_PRODUCT_KNOWLEDGE_ENABLED: ${REVIEW_WORKER_PRODUCT_KNOWLEDGE_ENABLED:-true}
      REVIEW_WORKER_PRODUCT_KNOWLEDGE_CALL_TIMEOUT_SECONDS: >-
        ${REVIEW_WORKER_PRODUCT_KNOWLEDGE_CALL_TIMEOUT_SECONDS:-5}
      REVIEW_WORKER_PRODUCT_KNOWLEDGE_DEADLINE_SECONDS: >-
        ${REVIEW_WORKER_PRODUCT_KNOWLEDGE_DEADLINE_SECONDS:-10}
      REVIEW_WORKER_PRODUCT_KNOWLEDGE_ALLOW_PRIVATE_NETWORKS: >-
        ${REVIEW_WORKER_PRODUCT_KNOWLEDGE_ALLOW_PRIVATE_NETWORKS:-true}
      REVIEW_WORKER_PRODUCT_KNOWLEDGE_ENDPOINT_ALLOWLIST: >-
        ${REVIEW_WORKER_PRODUCT_KNOWLEDGE_ENDPOINT_ALLOWLIST:-}
      # See webhook_api's own identical entry above for why this is a bare
      # pass-through (`KEY:`, no `:-` default) rather than
      # `${OTEL_EXPORTER_OTLP_ENDPOINT:-}`.
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
    # `host.docker.internal` is provided for free on Docker Desktop, but
    # plain Docker Engine on Linux needs this mapping to resolve it — this
    # is what actually makes the C4 doc's "worker calls LM Studio on the
    # Docker host" arrangement work on a Linux dev machine or a Linux CI
    # runner, not just macOS/Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Resource limits (Phase 5) — closes the gap between this pipeline's
    # per-step timeout (Phase 2) and actual container enforcement: a
    # pathological diff or a misbehaving analyzer subprocess (Gitleaks,
    # Semgrep) is bounded by both, not the timeout alone. Concrete starting
    # figures sized to run Gitleaks/Semgrep plus the Worker process
    # comfortably on a typical single-node Compose deployment (including
    # both analyzer sub-steps each materializing their own copy of the same
    # pre-filtered diff concurrently — see review/static_analysis.py's own
    # docstring), tunable per-deployment, not a value the platform
    # hardcodes.
    mem_limit: 2g
    cpus: "2"
    # No compose-level healthcheck: the Worker has no HTTP surface to probe
    # (apps/worker/dispatch.py's claim/dispatch loop, Phase 3, has no HTTP
    # surface either) — real liveness probing (a heartbeat file or a
    # minimal local health endpoint) is Phase 8 (production hardening)
    # scope, not built here. `main()`'s own startup checks (LLM
    # reachability, step configuration) are the fail-fast signal instead:
    # a genuine misconfiguration still exits non-zero at startup, logged
    # clearly, before this service ever reaches its dispatch loop. Once
    # past startup, `main()` runs the dispatch loop forever (Phase 3) — a
    # clean, intentional non-return, not a crash — so `restart:
    # unless-stopped` (not Compose's `"no"` default, unlike Phase 0/1/2's
    # "no dispatch loop wired yet" state that this replaces) keeps the
    # container up across the process's own long lifetime. A genuine
    # startup-check failure now restart-loops indefinitely rather than
    # exiting once — see docs/reference/operations.md's first entry for the
    # operator-facing diagnosis this trade-off requires — and
    # tests/e2e/test_compose_stack.py asserts the container stays
    # `running` (not `exited`) and never restarts during its observation
    # window, not the old "exits 0 once" claim.
    restart: unless-stopped

  # --- `observability` profile (docs/specs/spec-observability.md's Unit F)
  # ---
  # Additive-only: every service below carries `profiles: ["observability"]`,
  # so a plain `docker compose up` (no `--profile` flag) never starts any of
  # them — Compose only starts a profiled service when its profile is
  # explicitly requested (`--profile observability`) or listed in
  # `COMPOSE_PROFILES`. The default stack (postgres/migrate/webhook_api/
  # worker) is unchanged; only `docker compose --profile observability up`
  # additionally brings up an OTel Collector, Prometheus, and Grafana
  # (pre-loaded with Unit E's shipped dashboard), per US12's "optional local
  # demo path" scope. See .env.example for the one manual step this still
  # needs (pointing `OTEL_EXPORTER_OTLP_ENDPOINT` at the bundled collector —
  # Compose profiles gate *services*, not env var values, so that one step
  # can't be made profile-conditional inside this same file).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # OTLP gRPC receiver — what webhook_api/worker's
      # OTEL_EXPORTER_OTLP_ENDPOINT points at.
      - "${OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}:4317"
      # Prometheus-scrapeable metrics endpoint (also exposed on the host for
      # manual inspection; `prometheus` below scrapes it over the Compose
      # network, not this published port).
      - "${OTEL_COLLECTOR_PROMETHEUS_PORT:-8889}:8889"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      # Local demo only (see this block's own header comment) — never the
      # posture for a customer's own, separately-run Grafana, which has its
      # own access control entirely outside this platform's boundary (per
      # ADR-0008's own framing).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Unit E's one committed dashboard JSON, mounted read-only — not
      # copied, per this block's own header comment.
      - ./charts/review/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
