[alembic]
# Migration environment for adapter/storage's SQLAlchemy models.
# `sqlalchemy.url` is deliberately left unset here —
# `adapter/storage/migrations/env.py` reads the DSN from the
# `REVIEW_DATABASE_URL` environment variable (set by whichever entrypoint or
# test harness is running Alembic), consistent with
# docs/rules/architecture.md's "never read env vars from domain or adapter
# code" rule for *application* code — Alembic itself is a standalone CLI
# tool, not application code, so this is the one place in the repo a DSN is
# read from the environment directly.
script_location = adapter/storage/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
