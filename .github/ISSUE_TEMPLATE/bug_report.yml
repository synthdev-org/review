name: Bug report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that cause the problem.
      placeholder: |
        1. Start the stack
        2. Open a pull request
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Give the image tag, the release version, or the git commit hash.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Helm
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the log lines that show the problem. Remove all secrets, tokens, and private code first.
      render: text
    validations:
      required: false
