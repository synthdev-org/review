name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict .

      # US13 (docs/specs/spec-observability.md): fails the build if the
      # shipped Grafana dashboard (charts/review/dashboards/review.json)
      # references a metric name the instrumented code no longer emits, so
      # a future metric rename can't silently break it. Runs directly
      # (not via pytest) against this checked-out repo's own uv/Python —
      # this job doesn't need the Docker-only local/agent execution rule,
      # per that spec's Unit E deliverable #4.
      - name: Dashboard/metric drift guard
        run: uv run python scripts/check-dashboard-metrics.py

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # adapter/analyzers/test_semgrep.py runs the real Semgrep CLI, which
      # lives in its own locked environment (tools/semgrep, ADR-0013).
      - name: Install Semgrep (isolated environment)
        run: |
          set -euo pipefail
          uv sync --project tools/semgrep --locked
          mkdir -p "$HOME/.local/semgrep-bin"
          ln -sf "$PWD/tools/semgrep/.venv/bin/semgrep" "$HOME/.local/semgrep-bin/semgrep"
          echo "$HOME/.local/semgrep-bin" >> "$GITHUB_PATH"
          "$HOME/.local/semgrep-bin/semgrep" --version

      # No `-m integration` here on purpose: integration tests (Phase 2
      # onward, tagged @pytest.mark.integration) run on every PR, not every
      # push, per docs/rules/testing.md's CI-gating section. Plain `pytest`
      # already excludes them via pyproject.toml's `addopts`.
      - name: pytest (unit only)
        run: uv run pytest

  integration-test:
    name: Integration tests (Postgres)
    # Gated on pull requests, not every push, per docs/rules/testing.md's
    # CI-gating section ("Integration: every PR") and the plan's Phase 2
    # section. `testcontainers-python` (adapter/storage's migration,
    # SKIP LOCKED, and pgvector-presence tests) manages its own real
    # Postgres/pgvector container against the runner's Docker daemon, which
    # ubuntu-latest GitHub-hosted runners provide out of the box — no
    # `services:` container needed here.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Semgrep lives in its own locked environment (tools/semgrep) because
      # it conflicts with the main project's `mcp` pin (ADR-0013); the
      # adapter runs it as a `semgrep` subprocess found on PATH.
      - name: Install Semgrep (isolated environment)
        run: |
          set -euo pipefail
          uv sync --project tools/semgrep --locked
          mkdir -p "$HOME/.local/semgrep-bin"
          ln -sf "$PWD/tools/semgrep/.venv/bin/semgrep" "$HOME/.local/semgrep-bin/semgrep"
          echo "$HOME/.local/semgrep-bin" >> "$GITHUB_PATH"
          "$HOME/.local/semgrep-bin/semgrep" --version

      # Gitleaks is not (a Go binary
      # with no first-party Python packaging, per the plan's Assumptions
      # section) — this job runs `pytest -m integration` directly on the
      # runner, not inside the built Docker image (which vendors Gitleaks
      # itself, per the Dockerfile), so the binary needs installing here
      # too. Pinned to the same explicit tag as the Dockerfile
      # (v8.21.2, never `:latest`), verified against a checksum published
      # alongside that pinned GitHub release before use — a mismatch fails
      # the build, the same fatal-not-warn action every other pinning check
      # in this plan takes.
      - name: Install Gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          curl -sSL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          tar xzf "$ARCHIVE" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: pytest -m integration
        run: uv run pytest -m integration

  frontend:
    name: Frontend (typecheck, build, vitest)
    # apps/admin_api's React/TypeScript/Vite frontend (Phase 8, Unit I) —
    # its own dependency tree, separate from the Python `uv` project, so it
    # gets its own job with Node set up rather than piggybacking on the
    # `test` job above. Runs on every push, same as the Python unit-test
    # job, per docs/rules/testing.md's CI-gating rule ("Unit: every push")
    # — this is this tier's CI gate, not e2e.yml (which only builds the
    # frontend via Docker as part of the full Compose stack and never runs
    # `npm test`).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_api/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin_api/frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Type check + build
        run: npm run build

      - name: vitest run
        run: npm test

  helm-lint:
    name: Helm chart lint & template
    # No real cluster involved — the Helm-equivalent of the pyramid's unit
    # tier, per the plan's Phase 6 ("Helm chart skeleton") Tests section.
    # Runs on every push, same as the plain lint/unit-test jobs above,
    # since it's just as cheap and has no external dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.4"

      # charts/review/test-render.sh runs helm lint + helm template against
      # the default values.yaml, values-production.yaml layered on top
      # (asserting postgresql.enabled: false takes effect), and
      # postgresql.enabled: false plus an existingSecret reference for
      # every credential field (asserting no literal credential value
      # renders anywhere) — see the plan's Phase 6 Tests/Acceptance
      # sections.
      - name: helm lint + helm template checks
        run: ./charts/review/test-render.sh
