# Default values for the bundled postgresql subchart. Overridden from the
# parent chart via the top-level `postgresql:` values key (see
# charts/review/values.yaml) — standard Helm subchart values passthrough.
enabled: true

image:
  repository: pgvector/pgvector
  tag: pg16
  pullPolicy: IfNotPresent

auth:
  username: review
  password: review
  database: review

service:
  port: 5432

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

# UID and GID that the postgres process runs as (999 is the `postgres` user in
# the pgvector/pgvector image). The pod runs as non-root with no extra
# privileges.
securityContext:
  runAsUser: 999

# Requests and limits for the bundled trial database. Raise them for a larger
# trial. Production deployments use their own external Postgres instead.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 1Gi
