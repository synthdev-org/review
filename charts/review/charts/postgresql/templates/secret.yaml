# The bundled subchart's own credentials, sourced from its values.yaml
# (auth.username/password/database). This is deliberately separate from
# the parent chart's `database.url` credential field (charts/review/
# templates/secret.yaml) — when postgresql.enabled: true, the parent
# chart's default database.url is *derived* from these values (see
# charts/review/templates/_helpers.tpl's "review.databaseUrl" helper)
# rather than the operator supplying a URL directly.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.auth.password | quote }}
  POSTGRES_DB: {{ .Values.auth.database | quote }}
