# Credential rendering for GitHub App, LLM, and DB credentials, per the
# plan's Phase 6 section. Sourced from values.yaml by default; any field
# whose existingSecret.name is set is omitted here entirely — that
# Deployment's env instead reads straight from the referenced Secret/key
# (see templates/_helpers.tpl's "review.credentialEnvVar" helper) — so no
# literal credential value for that field ever appears in this chart's own
# rendered output, per the plan's Acceptance criterion.
#
# The whole resource is skipped if every credential field has been
# redirected to an existingSecret, since there would be nothing left of
# ours to store.
{{- $needsOwnSecret := or
      (not .Values.github.webhookSecret.existingSecret.name)
      (not .Values.github.setupStateSecret.existingSecret.name)
      (not .Values.github.appPrivateKey.existingSecret.name)
      (not .Values.llm.apiKey.existingSecret.name)
      (not .Values.database.url.existingSecret.name)
      (not .Values.adminApi.bootstrapUsername.existingSecret.name)
      (not .Values.adminApi.bootstrapPassword.existingSecret.name)
      (not .Values.adminApi.csrfSecret.existingSecret.name)
      (and .Values.productKnowledge.credentials.value (not .Values.productKnowledge.credentials.existingSecret.name))
}}
{{- if $needsOwnSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "review.secretName" . }}
  labels:
    {{- include "review.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.github.webhookSecret.existingSecret.name }}
  github-webhook-secret: {{ .Values.github.webhookSecret.value | quote }}
  {{- end }}
  {{- if not .Values.github.setupStateSecret.existingSecret.name }}
  github-setup-state-secret: {{ .Values.github.setupStateSecret.value | quote }}
  {{- end }}
  {{- if not .Values.github.appPrivateKey.existingSecret.name }}
  github-app-private-key: {{ .Values.github.appPrivateKey.value | quote }}
  {{- end }}
  {{- if not .Values.llm.apiKey.existingSecret.name }}
  llm-api-key: {{ .Values.llm.apiKey.value | quote }}
  {{- end }}
  {{- if not .Values.database.url.existingSecret.name }}
  database-url: {{ include "review.databaseUrl" . | quote }}
  {{- end }}
  {{- /* Admin API bootstrap/CSRF credentials (Phase 9, Assumptions 11 and 13). */}}
  {{- if not .Values.adminApi.bootstrapUsername.existingSecret.name }}
  admin-bootstrap-username: {{ .Values.adminApi.bootstrapUsername.value | quote }}
  {{- end }}
  {{- if not .Values.adminApi.bootstrapPassword.existingSecret.name }}
  admin-bootstrap-password: {{ .Values.adminApi.bootstrapPassword.value | quote }}
  {{- end }}
  {{- if not .Values.adminApi.csrfSecret.existingSecret.name }}
  admin-csrf-secret: {{ .Values.adminApi.csrfSecret.value | quote }}
  {{- end }}
  {{- if and .Values.adminApi.oidc.clientSecret.value (not .Values.adminApi.oidc.clientSecret.existingSecret.name) }}
  admin-oidc-client-secret: {{ .Values.adminApi.oidc.clientSecret.value | quote }}
  {{- end }}
  {{- /* Optional: the key is written only when a map was supplied, so an
         unset map leaves no key (and the Deployments render no env var). */}}
  {{- if and .Values.productKnowledge.credentials.value (not .Values.productKnowledge.credentials.existingSecret.name) }}
  product-knowledge-credentials: {{ .Values.productKnowledge.credentials.value | quote }}
  {{- end }}
{{- end }}
