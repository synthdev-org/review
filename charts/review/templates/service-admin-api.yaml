{{- if .Values.adminApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "review.fullname" . }}-admin-api
  labels:
    {{- include "review.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
spec:
  type: {{ .Values.adminApi.service.type }}
  ports:
    - port: {{ .Values.adminApi.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "review.selectorLabels" (dict "root" . "component" "admin-api") | nindent 4 }}
{{- end }}
