apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "review.fullname" . }}-worker
  labels:
    {{- include "review.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "review.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "review.labels" . | nindent 8 }}
        {{- include "review.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["python", "-m", "apps.worker.main"]
          envFrom:
            - configMapRef:
                name: {{ include "review.fullname" . }}-config
          env:
            {{- include "review.credentialEnvVar" (dict "envName" "REVIEW_WORKER_LLM_API_KEY" "field" .Values.llm.apiKey "secretName" (include "review.secretName" .) "secretKey" "llm-api-key") | nindent 12 }}
            {{- include "review.credentialEnvVar" (dict "envName" "REVIEW_WORKER_GITHUB_APP_PRIVATE_KEY" "field" .Values.github.appPrivateKey "secretName" (include "review.secretName" .) "secretKey" "github-app-private-key") | nindent 12 }}
            {{- include "review.credentialEnvVar" (dict "envName" "REVIEW_DATABASE_URL" "field" .Values.database.url "secretName" (include "review.secretName" .) "secretKey" "database-url") | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
